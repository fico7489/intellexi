services:

    nginx:
        container_name: intellexi_nginx
        build: ./.docker/nginx
        volumes:
            - ./:/var/www/html
            - ./.docker/nginx/nginx.conf:/etc/nginx/nginx.conf
        ports:
            - '5005:80'

    php:
        container_name: intellexi_php
        build: ./.docker/php
        volumes:
            - ./:/var/www/html

    mysql:
        container_name: intellexi_mysql
        build: ./.docker/mysql
        environment:
            - "MYSQL_ROOT_PASSWORD=root"
            - "MYSQL_DATABASE=intellexi"
            - "MYSQL_USER=intellexi"
            - "MYSQL_PASSWORD=intellexi"
        volumes:
            - mysql_data:/var/lib/mysql
            - ./:/app
        ports:
            - "33309:3306"

    elasticsearch:
        container_name: intellexi_elasticsearch
        build: ./.docker/elasticsearch
        environment:
            - node.name=intellexi_elasticsearch
            - cluster.name=es-docker-cluster
            - discovery.type=single-node
            - bootstrap.memory_lock=true
            - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
        ulimits:
            memlock:
                soft: -1
                hard: -1
        ports: [ '9200:9200' ]
        volumes:
            - 'elasticsearch_data:/usr/share/elasticsearch/data'

    kibana:
        container_name: intellexi_kibana
        build: ./.docker/kibana
        ports: [ '5601:5601' ]
        depends_on: [ 'elasticsearch' ]

    redis:
        container_name: intellexi_redis
        build: ./.docker/redis
        volumes:
            - redis_data:/data
        ports:
            - "36380:6379"

    maxwell:
        container_name: intellexi_maxwell
        build: ./.docker/maxwell

volumes:
    mysql_data:
    elasticsearch_data:
    redis_data:

